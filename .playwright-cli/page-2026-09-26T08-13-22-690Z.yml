      - list [ref=f2e168]:
        - listitem [ref=f2e169]:
          - generic [ref=f2e170]: "01"
          - generic [ref=f2e171]:
            - heading "Herbs" [level=3] [ref=f2e172]
            - paragraph [ref=f2e173]: Stacked with the unique and special herbs used in authentic Cebu lechon. A distinct flavor people talk about long after they have tasted the recipe.
        - listitem [ref=f2e174]:
          - generic [ref=f2e175]: "02"
          - generic [ref=f2e176]:
            - heading "Size" [level=3] [ref=f2e177]
            - paragraph [ref=f2e178]: 600g uncooked, which cooks down to a full 1/2 kilo served. Most take-out liempos put out 250–300g. Ours is not a snack.
        - listitem [ref=f2e179]:
          - generic [ref=f2e180]: "03"
          - generic [ref=f2e181]:
            - heading "Price" [level=3] [ref=f2e182]
            - paragraph [ref=f2e183]: Average lechon runs ₱375/kilo in Cebu and about ₱600 in Metro Manila. Measured by the kilo, Balamban Liempo comes in better priced — gram per gram, other liempos cost more.
