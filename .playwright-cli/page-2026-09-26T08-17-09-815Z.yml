      - list [ref=f3e153]:
        - listitem [ref=f3e154]:
          - generic [ref=f3e155]: "01"
          - generic [ref=f3e156]:
            - heading "Herbs" [level=3] [ref=f3e157]
            - paragraph [ref=f3e158]: Stacked with the unique and special herbs used in authentic Cebu lechon. A distinct flavor people talk about long after they have tasted the recipe.
        - listitem [ref=f3e159]:
          - generic [ref=f3e160]: "02"
          - generic [ref=f3e161]:
            - heading "Size" [level=3] [ref=f3e162]
            - paragraph [ref=f3e163]: 600g uncooked, which cooks down to a full 1/2 kilo served. Most take-out liempos put out 250–300g. Ours is not a snack.
        - listitem [ref=f3e164]:
          - generic [ref=f3e165]: "03"
          - generic [ref=f3e166]:
            - heading "Price" [level=3] [ref=f3e167]
            - paragraph [ref=f3e168]: Average lechon runs ₱375/kilo in Cebu and about ₱600 in Metro Manila. Measured by the kilo, Balamban Liempo comes in better priced — gram per gram, other liempos cost more.
