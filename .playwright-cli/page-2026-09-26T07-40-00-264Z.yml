        - listitem [ref=f1e169]:
          - generic [ref=f1e170]: "01"
          - generic [ref=f1e171]:
            - heading "Herbs" [level=3] [ref=f1e172]
            - paragraph [ref=f1e173]: Stacked with the unique and special herbs used in authentic Cebu lechon. A distinct flavor people talk about long after they have tasted the recipe.
        - listitem [ref=f1e174]:
          - generic [ref=f1e175]: "02"
          - generic [ref=f1e176]:
            - heading "Size" [level=3] [ref=f1e177]
            - paragraph [ref=f1e178]: 600g uncooked, which cooks down to a full 1/2 kilo served. Most take-out liempos put out 250–300g. Ours is not a snack.
        - listitem [ref=f1e179]:
          - generic [ref=f1e180]: "03"
          - generic [ref=f1e181]:
            - heading "Price" [level=3] [ref=f1e182]
            - paragraph [ref=f1e183]: Average lechon runs ₱375/kilo in Cebu and about ₱600 in Metro Manila. Measured by the kilo, Balamban Liempo comes in better priced — gram per gram, other liempos cost more.
