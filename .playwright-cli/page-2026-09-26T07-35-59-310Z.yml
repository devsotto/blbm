            - heading "Herbs" [level=3] [ref=e172]
            - paragraph [ref=e173]: Stacked with the unique and special herbs used in authentic Cebu lechon. A distinct flavor people talk about long after they have tasted the recipe.
        - listitem [ref=e174]:
