          - generic [ref=e176]:
            - heading "Size" [level=3] [ref=e177]
            - paragraph [ref=e178]: 600g uncooked, which cooks down to a full 1/2 kilo served. Most take-out liempos put out 250–300g. Ours is not a snack.
        - listitem [ref=e179]:
          - generic [ref=e180]: "03"
          - generic [ref=e181]:
            - heading "Price" [level=3] [ref=e182]
            - paragraph [ref=e183]: Average lechon runs ₱375/kilo in Cebu and about ₱600 in Metro Manila. Measured by the kilo, Balamban Liempo comes in better priced — gram per gram, other liempos cost more.
