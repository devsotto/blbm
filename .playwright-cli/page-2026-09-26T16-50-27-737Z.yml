  - paragraph [ref=f1e18]: A six-time SunStar Best of Cebu brand, ninety-plus outlets nationwide, and a product people queue for. Here is what an outlet typically costs to put up and what a single branch can look like once it is running.
  - generic [ref=f1e19]:
